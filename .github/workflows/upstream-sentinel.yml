name: upstream-sentinel
on:
  schedule:
    - cron: '0 1 * * *'  # UTC 01:00 = 北京时间 09:00
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check upstream
        run: |
          git remote add upstream https://github.com/misskey-dev/misskey.git
          git fetch upstream
          BEHIND=$(git rev-list --count HEAD..upstream/develop)
          echo "Behind: $BEHIND"
          if [ "$BEHIND" -gt 0 ]; then
            curl -X POST "$ROUTINE_ENDPOINT" \
              -H "Authorization: Bearer $ROUTINE_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"behind\": $BEHIND}"
          fi
        env:
          ROUTINE_ENDPOINT: ${{ secrets.CC_ROUTINE_ENDPOINT }}
          ROUTINE_TOKEN: ${{ secrets.CC_ROUTINE_TOKEN }}
